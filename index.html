<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedrock Tweaks</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e17 0%, #151d2f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
            border-bottom: 3px solid #ffd700;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
            font-weight: 900;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.9rem;
            color: #9db4d0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .packs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.2rem;
            margin-top: 1.5rem;
        }

        .pack-card {
            background: linear-gradient(135deg, #1a2640 0%, #0f1825 100%);
            border: 2px solid #ffd700;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .pack-card:hover {
            transform: translateY(-4px);
            border-color: #ffed4e;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.2);
        }

        .pack-header {
            background: linear-gradient(135deg, #0a0e17, #0f1419);
            padding: 1.2rem;
            text-align: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
        }

        .pack-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .pack-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 0.2rem;
        }

        .pack-count {
            font-size: 0.8rem;
            color: #7a8fa3;
        }

        .pack-styles {
            padding: 1rem;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .pack-styles.active {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.6rem;
        }

        .style-option {
            background: rgba(255, 215, 0, 0.08);
            border: 2px solid rgba(255, 215, 0, 0.2);
            color: #b0c4de;
            padding: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-align: left;
        }

        .style-option:hover {
            background: rgba(255, 215, 0, 0.15);
            border-color: #ffd700;
            color: #ffd700;
        }

        .style-option.selected {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border-color: #ffed4e;
            color: #0a0e17;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }

        .pack-selection {
            background: rgba(255, 215, 0, 0.08);
            border-top: 2px solid rgba(255, 215, 0, 0.2);
            padding: 0.8rem;
            text-align: center;
            font-size: 0.8rem;
            color: #9db4d0;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pack-selection.active {
            color: #ffd700;
            font-weight: 600;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a2640 0%, #0f1825 100%);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.3);
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-content h2 {
            color: #ffd700;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1.3rem;
        }

        .modal-content p {
            color: #b0c4de;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            color: #ffd700;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 215, 0, 0.08);
            border: 2px solid #ffd700;
            color: #e0e0e0;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ffed4e;
            background: rgba(255, 215, 0, 0.15);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .input-group input::placeholder {
            color: #7a8fa3;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #0a0e17;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            border: 2px solid #ffd700;
        }

        .btn-secondary:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffed4e;
            color: #ffed4e;
        }

        .download-fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 50%;
            color: #0a0e17;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }

        .download-fab:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 32px rgba(255, 215, 0, 0.5);
        }

        .download-fab:active {
            transform: scale(0.95);
        }

        .download-fab.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: scale(0.9);
        }

        .status-bar {
            position: fixed;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #ffd700;
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            z-index: 50;
            color: #b0c4de;
            font-size: 0.9rem;
            max-width: 90%;
            text-align: center;
            display: none;
        }

        .status-bar.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .status-bar strong {
            color: #ffd700;
        }

        .credits {
            text-align: center;
            padding: 2rem 1rem;
            color: #7a8fa3;
            font-size: 0.85rem;
            border-top: 2px solid rgba(255, 215, 0, 0.1);
            margin-top: 2rem;
        }

        .credits a {
            color: #ffd700;
            text-decoration: none;
            transition: color 0.2s;
        }

        .credits a:hover {
            color: #ffed4e;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5rem;
            }

            .packs-grid {
                grid-template-columns: 1fr;
            }

            .download-fab {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
                bottom: 1rem;
                right: 1rem;
            }
        }

        .pack-styles::-webkit-scrollbar {
            width: 6px;
        }

        .pack-styles::-webkit-scrollbar-track {
            background: rgba(255, 215, 0, 0.1);
        }

        .pack-styles::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 3px;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffd700;
            animation: blink 1.4s infinite both;
        }

        @keyframes blink {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🎮 BEDROCK TWEAKS</h1>
        <p>Crie seus packs customizados com a imagem exclusiva</p>
    </header>

    <div class="status-bar" id="statusBar"></div>

    <div class="container">
        <div class="packs-grid" id="packsGrid"></div>
        <div class="credits">
            Desenvolvido por <a href="#">Weslleymc01</a> | Packs compilados por <a href="#">SinixtroPlay</a><br>
            © 2026 Bedrock Tweaks - Todos os direitos reservados
        </div>
    </div>

    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h2>🎨 Nomear Textura</h2>
            <p>Dê um nome personalizado para sua textura</p>
            <div class="input-group">
                <label>Nome da Textura:</label>
                <input type="text" id="textureNameInput" placeholder="Ex: Minha Textura Legal" maxlength="50">
            </div>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="createBtn" onclick="confirmPackName()">Criar Pack</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>

    <button class="download-fab disabled" id="downloadBtn" onclick="openNameModal()" title="Baixar textura customizada">
        ⬇️
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        const packsData = [
            {
                id: 'elytras',
                name: 'Estilos de Elytras',
                icon: '🦅',
                count: 23,
                file: 'Estilos_de_Elytras.mcpack',
                styles: [
                    'Minecraft: O Filme - Menace',
                    'Minecraft: O Filme - Home',
                    'Minecraft: O Filme - Yearn',
                    'Campeão dos 15 Desafios',
                    'Aniversário de 15 Anos',
                    'Comemoração de 1 Milhão',
                    'Tradutor',
                    'Cavalo Zumbi',
                    'Cobre',
                    'Cobalto',
                    'Experience',
                    'Eyeblossom',
                    'Cherry Blossom',
                    'TikTok',
                    'Twitch',
                    'Minecraft',
                    'Minecon 2019',
                    'Minecon 2020',
                    'Minecon 2021',
                    'Minecon 2022',
                    'Minecon 2023',
                    'Minecon 2024',
                    'Minecon 2025'
                ]
            },
            {
                id: 'barras',
                name: 'Estilos de Barras de Inventário',
                icon: '📦',
                count: 8,
                file: 'Estilos_de_Barras_de_Inventário.mcpack',
                styles: [
                    'Barra Escura',
                    'Barra Clara',
                    'Barra Gradiente',
                    'Barra Transparente',
                    'Barra Minecraft',
                    'Barra Neon',
                    'Barra Clássica',
                    'Barra Moderna'
                ]
            },
            {
                id: 'interface',
                name: 'Estilos de Interface',
                icon: '🎮',
                count: 12,
                file: 'Estilos_de_Interface.mcpack',
                styles: [
                    'Ore UI (Escura)',
                    'Ore UI (Clara)',
                    'Transparente Escura',
                    'Transparente',
                    'Willzy',
                    'Cinza',
                    'Escura',
                    'Clara',
                    'Neon',
                    'Flat Design',
                    'Minecraft Default',
                    'Moderna'
                ]
            }
        ];

        let selections = {
            elytras: null,
            barras: null,
            interface: null
        };

        // Ícone customizado em base64 (será preenchido)
        let customIcon = null;

        async function initializePage() {
            const grid = document.getElementById('packsGrid');
            packsData.forEach(pack => {
                grid.appendChild(createPackCard(pack));
            });

            // Carrega a imagem customizada
            await loadCustomIcon();
        }

        async function loadCustomIcon() {
            try {
                const response = await fetch('./1000948965.jpg');
                if (response.ok) {
                    customIcon = await response.arrayBuffer();
                }
            } catch (e) {
                console.log('Imagem não encontrada, usando padrão');
            }
        }

        function createPackCard(pack) {
            const card = document.createElement('div');
            card.className = 'pack-card';
            card.innerHTML = `
                <div class="pack-header" onclick="toggleStyles('${pack.id}')">
                    <div class="pack-icon">${pack.icon}</div>
                    <div class="pack-title">${pack.name}</div>
                    <div class="pack-count">${pack.count} estilos</div>
                </div>
                <div class="pack-styles" id="styles-${pack.id}">
                    ${pack.styles.map(style => `
                        <div class="style-option" onclick="selectStyle('${pack.id}', '${style}', this)">
                            ${style}
                        </div>
                    `).join('')}
                </div>
                <div class="pack-selection" id="selection-${pack.id}">
                    Clique em um estilo
                </div>
            `;
            return card;
        }

        function toggleStyles(packId) {
            const stylesDiv = document.getElementById(`styles-${packId}`);
            stylesDiv.classList.toggle('active');
        }

        function selectStyle(packId, style, element) {
            document.querySelectorAll(`#styles-${packId} .style-option`).forEach(el => {
                el.classList.remove('selected');
            });
            element.classList.add('selected');
            selections[packId] = style;

            const selectionDiv = document.getElementById(`selection-${packId}`);
            selectionDiv.textContent = style;
            selectionDiv.classList.add('active');

            updateDownloadButton();
            showStatus();
        }

        function updateDownloadButton() {
            const hasSelection = Object.values(selections).some(s => s !== null);
            const btn = document.getElementById('downloadBtn');
            
            if (hasSelection) {
                btn.classList.remove('disabled');
            } else {
                btn.classList.add('disabled');
            }
        }

        function showStatus() {
            const selected = Object.values(selections).filter(s => s !== null).length;
            const status = document.getElementById('statusBar');
            if (selected > 0) {
                status.innerHTML = `<strong>${selected}</strong> estilo(s) selecionado(s)`;
                status.classList.add('show');
            }
        }

        function openNameModal() {
            if (Object.values(selections).every(s => s === null)) {
                alert('Selecione pelo menos 1 estilo!');
                return;
            }
            document.getElementById('textureNameInput').value = '';
            document.getElementById('nameModal').classList.add('show');
            document.getElementById('textureNameInput').focus();
        }

        function closeModal() {
            document.getElementById('nameModal').classList.remove('show');
        }

        function confirmPackName() {
            const name = document.getElementById('textureNameInput').value.trim();
            if (!name) {
                alert('Digite um nome para sua textura!');
                return;
            }
            createAndDownloadPack(name);
            closeModal();
        }

        async function createAndDownloadPack(packName) {
            const createBtn = document.getElementById('createBtn');
            createBtn.disabled = true;
            createBtn.innerHTML = '<span class="loading"></span> Criando...';

            try {
                const zip = new JSZip();
                let mergedTextures = {};

                // Combina textures dos packs selecionados
                for (const [key, style] of Object.entries(selections)) {
                    if (style === null) continue;

                    const packInfo = packsData.find(p => p.id === key);
                    if (!packInfo) continue;

                    try {
                        const response = await fetch(`./${packInfo.file}`);
                        if (!response.ok) throw new Error(`Pack ${packInfo.file} não encontrado`);

                        const packData = await response.arrayBuffer();
                        const packZip = await JSZip.loadAsync(packData);

                        // Extrai textures
                        packZip.folder('subpacks').forEach(folderName => {
                            const folderPath = `subpacks/${folderName}`;
                            if (packZip.folder(folderPath)) {
                                packZip.folder(folderPath).forEach((relativePath, file) => {
                                    if (relativePath.includes('textures/') || relativePath.includes('models/')) {
                                        zip.file(`${folderPath}${relativePath.startsWith('/') ? '' : '/'}${relativePath}`, file.async('arraybuffer'));
                                    }
                                });
                            }
                        });

                        // Se tiver textures na raiz
                        if (packZip.folder('textures')) {
                            packZip.folder('textures').forEach((relativePath, file) => {
                                zip.file(`textures/${relativePath}`, file.async('arraybuffer'));
                            });
                        }
                    } catch (e) {
                        console.log(`Aviso: Erro ao processar ${packInfo.file}:`, e.message);
                    }
                }

                // Cria manifest.json
                const manifest = {
                    format_version: 2,
                    header: {
                        name: packName,
                        description: "Pack customizado criado no Bedrock Tweaks",
                        uuid: generateUUID(),
                        version: [1, 0, 0],
                        min_engine_version: [1, 21, 0]
                    },
                    modules: [{
                        type: "resources",
                        uuid: generateUUID(),
                        version: [1, 0, 0]
                    }]
                };

                zip.file('manifest.json', JSON.stringify(manifest, null, 2));

                // Adiciona ícone customizado ou padrão
                if (customIcon) {
                    zip.file('pack_icon.jpg', customIcon, {binary: true});
                } else {
                    // PNG transparente padrão
                    const defaultIcon = new Uint8Array([
                        137, 80, 78, 71, 13, 10, 26, 10, 0, 0, 0, 13, 73, 72, 68, 82,
                        0, 0, 0, 1, 0, 0, 0, 1, 8, 6, 0, 0, 0, 31, 21, 196, 137, 0,
                        0, 0, 10, 73, 68, 65, 84, 8, 29, 1, 0, 0, 255, 255, 0, 0, 0,
                        0, 0, 1, 0, 0, 147, 245, 18, 85, 0, 0, 0, 0, 73, 69, 78, 68,
                        174, 66, 96, 130
                    ]);
                    zip.file('pack_icon.png', defaultIcon, {binary: true});
                }

                // Cria credits.txt
                const credits = `BEDROCK TWEAKS - CRÉDITOS
========================================

Pack: ${packName}
Criado em: ${new Date().toLocaleDateString('pt-BR')}

Desenvolvedor do Site:
- Weslleymc01

Compilação dos Packs:
- SinixtroPlay

Estilos Selecionados:
- Elytras: ${selections.elytras || 'Não selecionado'}
- Barras de Inventário: ${selections.barras || 'Não selecionado'}
- Interface: ${selections.interface || 'Não selecionado'}

========================================
© 2026 Bedrock Tweaks
Todos os direitos reservados
========================================

Este pack foi criado utilizando os packs compilados
por SinixtroPlay através do site Bedrock Tweaks.

Desenvolvido por: Weslleymc01
Plataforma: Bedrock Tweaks v1.0
`;
                zip.file('credits.txt', credits);

                // Gera arquivo
                const content = await zip.generateAsync({type: 'blob'});
                const url = URL.createObjectURL(content);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${packName.replace(/\s+/g, '_')}.mcpack`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                setTimeout(() => {
                    alert(`✅ Pack "${packName}" baixado com sucesso!\n\nEstilos:\n${Object.entries(selections).filter(([,v]) => v).map(([k,v]) => `• ${v}`).join('\n')}`);
                }, 500);

            } catch (error) {
                alert('Erro ao criar o pack: ' + error.message);
                console.error(error);
            } finally {
                createBtn.disabled = false;
                createBtn.innerHTML = 'Criar Pack';
            }
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        document.getElementById('textureNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') confirmPackName();
        });

        document.getElementById('nameModal').addEventListener('click', (e) => {
            if (e.target.id === 'nameModal') closeModal();
        });

        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
